# pons-launcher — rhbond.xyz
#
# HTTP only on purpose: run `certbot --nginx -d rhbond.xyz -d api.rhbond.xyz`
# after installing this and certbot rewrites both blocks with TLS + redirects.
#
# Two hostnames, one backend:
#   rhbond.xyz      the console. The backend serves frontend/dist AND /api from
#                   the same origin, so the console's relative /api calls work
#                   with no CORS and no code change.
#   api.rhbond.xyz  the same backend, for calling the API directly.
#
# The app binds 127.0.0.1 (see HOST in backend/.env) — nginx is the only way in,
# and it is the security boundary, not an afterthought. This console can spend
# every wallet it holds.
#
#   sudo apt install apache2-utils
#   sudo htpasswd -c /etc/nginx/.htpasswd-launcher <you>

# Each basic-auth login is handed its own API key, so nobody types one and the
# app still learns who is calling. Keys live here, in a root-only file, rather
# than in someone's password manager.
map $remote_user $user_key {
    default "";
    # ivan  "<ivan's key from: npm run user:add -- ivan>";
    # alice "<alice's key>";
}

server {
    listen 80;
    listen [::]:80;
    server_name rhbond.xyz www.rhbond.xyz;

    # The console is a human interface: password it. certbot adds TLS below.
    auth_basic           "pons-launcher";
    auth_basic_user_file /etc/nginx/.htpasswd-launcher;

    # Optional second lock — uncomment and set your own address.
    # allow 203.0.113.7;
    # deny  all;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Logo uploads are proxied to pons' IPFS worker; their cap is 5 MB and
    # nginx's default body limit is 1 MB, which would 413 before the app sees it.
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Replaces anything the client sent — a browser cannot present someone
        # else's key by hand.
        proxy_set_header x-api-key $user_key;

        # A launch signs and broadcasts a whole bundle before responding.
        proxy_read_timeout 180s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.rhbond.xyz;

    # No basic auth here: this host is for programmatic calls, where a browser
    # password prompt is in the way. The app's own API_KEY guards every mutating
    # route (backend/src/middleware/auth.js) — so API_KEY is NOT optional on
    # this deployment. Set it in backend/.env before going live.
    #
    # Strongly recommended: restrict to your own address as well.
    # allow 203.0.113.7;
    # deny  all;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}
