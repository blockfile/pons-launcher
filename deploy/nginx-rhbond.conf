# pons-launcher — rhbond.xyz
#
# Three hostnames, one backend:
#   rhbond.xyz       the console. The backend serves frontend/dist AND /api from
#                    the same origin, so the console's relative /api calls work
#                    with no CORS and no code change.
#   api.rhbond.xyz   the same backend, for calling the API from scripts.
#   dapp.rhbond.xyz  the PUBLIC take-profit dApp (frontend/dist/dapp + /api/tp/*
#                    only). See its block below for why it has no password.
#
# The app binds 127.0.0.1 (HOST in backend/.env) — nginx is the only way in, and
# it is the security boundary, not an afterthought. This console can spend every
# wallet it holds, so BOTH console hostnames are password protected. The per-user
# API key decides whose wallets you see; basic auth decides whether you may ask.
#
#   sudo apt install apache2-utils
#   sudo htpasswd -c /etc/nginx/.htpasswd-launcher <you>     # FIRST user only
#   sudo htpasswd    /etc/nginx/.htpasswd-launcher <them>    # everyone after
#
# TLS lines below are certbot's. Re-run it after adding a hostname:
#   sudo certbot --nginx --cert-name rhbond.xyz -d rhbond.xyz -d www.rhbond.xyz -d api.rhbond.xyz -d dapp.rhbond.xyz

# OPTIONAL: hand each login its own API key so nobody types one.
#
# Leave this commented unless you list EVERY login. With it active, a login
# missing from the list gets the empty default and cannot authenticate at all —
# not even by pasting their own key, because proxy_set_header below overwrites
# whatever the browser sent before the app sees it. Uncomment the map and the
# proxy_set_header line together, or neither.
#
# map $remote_user $user_key {
#     default "";
#     ivan    "<ivan's key from: npm run user:add -- ivan>";
#     alice   "<alice's key>";
# }

server {
    server_name rhbond.xyz www.rhbond.xyz;

    # The console is a human interface: password it.
    auth_basic           "pons-launcher";
    auth_basic_user_file /etc/nginx/.htpasswd-launcher;

    # Optional second lock — uncomment and set your own address.
    # allow 203.0.113.7;
    # deny  all;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Logo uploads are proxied to pons' IPFS worker; their cap is 5 MB and
    # nginx's default body limit is 1 MB, which would 413 before the app sees it.
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pairs with the map above — uncomment BOTH or neither.
        # proxy_set_header x-api-key $user_key;

        # A launch signs and broadcasts a whole bundle before responding.
        #
        # KEEP GATEWAY_TIMEOUT_MS (backend/.env) IN STEP WITH THIS. The console
        # projects the untimed v2 Relay funding run against that value to warn,
        # before the press, that the quote phase will outlast this directive —
        # a 504 there is the gateway giving up, not the run failing. Raising one
        # without the other either warns about a wall that is gone or hides one
        # that is still there.
        proxy_read_timeout 180s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/rhbond.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/rhbond.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    server_name api.rhbond.xyz;

    # Locked, like the console. Every route that can move funds sits behind
    # this, and an API key alone is a single secret guarding live wallets —
    # one lock is not enough for that. Scripts pass both credentials:
    #
    #   curl -u alice:<password> -H 'x-api-key: <alice's key>' \
    #        https://api.rhbond.xyz/api/wallets
    #
    # /api/health is behind it too. Nothing needs that anonymously.
    auth_basic           "pons-launcher api";
    auth_basic_user_file /etc/nginx/.htpasswd-launcher;

    # Strongest available lock — uncomment and set your own address.
    # allow 203.0.113.7;
    # deny  all;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Same 180s, same pairing with GATEWAY_TIMEOUT_MS as the block above.
        proxy_read_timeout 180s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/rhbond.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/rhbond.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# ─────────────────────────────────────────────────────────────────────────────
# dapp.rhbond.xyz — the PUBLIC take-profit dApp
# (docs/superpowers/specs/2026-09-19-tp-dapp-design.md)
#
# NO PASSWORD, DELIBERATELY. Visitors bring their own wallets; their keys stay in
# their browser and are never sent here. The backend module behind it
# (backend/src/tp) holds no key and cannot reach the keystore.
#
# What makes a public hostname safe on a backend that CAN spend the console's
# wallets is the ALLOWLIST below: the dApp page, its /dapp/assets and /api/tp/* are
# reachable; every other /api path is a 404 on this hostname, in any letter case.
# The server enforces the same allowlist by Host (DAPP_HOST in backend/.env), so a
# mis-edit here still does not expose the console — and a mis-edit there is still
# caught here.
#
# THE RATE-LIMIT ZONE IS NOT IN THIS FILE. limit_req_zone is http-level, and a
# zone defined in a site file breaks the moment that file is included twice. It
# lives in its own one-line file, /etc/nginx/conf.d/tp-limits.conf:
#
#   limit_req_zone $binary_remote_addr zone=tp:10m rate=10r/s;
#
# Until that file exists, nginx -t fails with: zero size shared memory zone "tp".
#
# HTTP/2. `listen ... ssl http2` is the form for nginx older than 1.25.1 (Ubuntu
# 22.04 ships 1.18, 24.04 ships 1.24). From 1.25.1 it still works but warns; there,
# write `listen 443 ssl;` / `listen [::]:443 ssl;` and add a line `http2 on;`.
# Before 1.25.1 the flag applies to every server block on the same address:port,
# so the console gets HTTP/2 as well — harmless, and it lifts the browser's
# six-connections-per-host cap for the chart stream plus API calls.
#
# The ssl_* lines point at the rhbond.xyz certificate BEFORE it covers this name.
# Browsers warn on this hostname until the certbot line at the top of this file
# has been re-run with -d dapp.rhbond.xyz; nginx itself does not check the names.
# ─────────────────────────────────────────────────────────────────────────────
server {
    server_name dapp.rhbond.xyz;

    server_tokens off;

    # Every header carries `always`, so the 404s and 429s below get them too.
    # NO add_header MAY APPEAR INSIDE A LOCATION: one there REPLACES this whole
    # set for that location instead of adding to it.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;

    proxy_hide_header X-Powered-By;

    # nginx answers an over-limit request 503 by default; 429 is what the app
    # itself answers (TpError 'rate_limited'), so the dApp sees one code.
    limit_req_status 429;

    # Matches express.json({ limit: '1mb' }) in backend/server.js. The biggest
    # body is a /broadcast of 100 signed transactions, far below this.
    client_max_body_size 1m;

    # The dApp's JS and CSS are served by Express uncompressed. Level 6 is the
    # level the 250 KB first-load budget is measured at
    # (frontend/scripts/dapp-size.mjs); nginx's default, 1, would send more bytes.
    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # proxy_set_header is repeated in every location on purpose: a location that
    # sets ANY proxy_set_header inherits NONE from the server level, and the
    # stream location must set Connection. X-Real-IP is what the app's per-IP
    # limits key on (backend/src/tp/limits.js clientIp, trusted only from a
    # loopback peer — this nginx — because it is overwritten here).
    # X-Forwarded-For and X-Forwarded-Host are overwritten too, not appended: on
    # a public hostname no client-sent value of either may reach the app.

    # The live chart and receipt stream (SSE).
    location ^~ /api/tp/stream {
        # Opening a stream is one request; a client stuck in a reconnect loop is
        # throttled here. The app separately caps OPEN streams at 5 per IP.
        limit_req zone=tp burst=20 nodelay;

        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Keep the upstream connection open and hand every event on the moment
        # the app writes it. The app also sends X-Accel-Buffering: no.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        # The app pings every 15 s, so this only ends a stream that has lived an
        # hour; the browser reconnects and gets a fresh snapshot.
        proxy_read_timeout 1h;
    }

    # The dApp API: token, wallets, fees, quotes, broadcast. Public, no key.
    location ^~ /api/tp/ {
        limit_req zone=tp burst=40 nodelay;

        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # EVERY OTHER /api PATH: the console's routes, key export and backup
    # included. Never proxied from this hostname.
    location /api/ {
        default_type application/json;
        return 404 '{"error":"not found"}';
    }

    # The same, case-insensitively. nginx prefix locations are case-sensitive but
    # Express routes are not, so /API/wallets would otherwise skip the block
    # above and reach the app through location /. The ^~ on the two /api/tp/
    # locations keeps this regex from ever shadowing them.
    location ~* ^/api(/|$) {
        default_type application/json;
        return 404 '{"error":"not found"}';
    }

    # The dApp page and its /dapp/assets (the console's /assets are a 404 from the
    # host gate). The server's host gate answers every other
    # path on this hostname with frontend/dist/dapp/index.html.
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    listen [::]:443 ssl http2;
    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/rhbond.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rhbond.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.rhbond.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = rhbond.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name rhbond.xyz www.rhbond.xyz;
    return 404; # managed by Certbot
}

server {
    if ($host = api.rhbond.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name api.rhbond.xyz;
    return 404; # managed by Certbot
}

# dapp.rhbond.xyz over plain HTTP: redirect only. certbot's HTTP-01 check still
# gets through — during validation its nginx plugin puts a
# `rewrite ^(/.well-known/acme-challenge/.*) $1 break;` at the TOP of this block,
# ahead of the redirect, the same way it renews through the two blocks above.
server {
    listen 80;
    listen [::]:80;
    server_name dapp.rhbond.xyz;
    return 301 https://$host$request_uri;
}
