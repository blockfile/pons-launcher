# pons-launcher — reverse proxy.
#
# This console can spend every wallet it holds, so nginx is the security
# boundary, not an afterthought. The app binds 127.0.0.1; this is the only way
# in, and it is behind TLS + basic auth.
#
#   sudo apt install apache2-utils
#   sudo htpasswd -c /etc/nginx/.htpasswd-launcher <you>
#   sudo certbot --nginx -d launcher.example.com

server {
    listen 80;
    server_name launcher.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name launcher.example.com;

    ssl_certificate     /etc/letsencrypt/live/launcher.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/launcher.example.com/privkey.pem;

    auth_basic           "pons-launcher";
    auth_basic_user_file /etc/nginx/.htpasswd-launcher;

    # Optional second lock: restrict to your own IP.
    # allow 203.0.113.7;
    # deny  all;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A launch signs and broadcasts a whole bundle before responding.
        proxy_read_timeout 180s;
    }
}
