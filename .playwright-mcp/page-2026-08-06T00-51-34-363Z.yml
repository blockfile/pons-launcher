                - text: Built by the most trusted team in DeFi
              - paragraph [ref=f6e179]: "Pools is built by Uniswap Labs and comes with:"
              - list [ref=f6e180]:
                - listitem [ref=f6e181]:
                  - generic [ref=f6e182]:
                    - strong [ref=f6e183]: "Autocompounding liquidity:"
                    - text: LP fees autocompound back into the locked position
                - listitem [ref=f6e184]:
                  - generic [ref=f6e185]:
                    - strong [ref=f6e186]: "Sniping mitigation:"
                    - text: Creators buy in the same block the token is launched, preventing snipers from being the first to buy a new token
                - listitem [ref=f6e187]:
                  - generic [ref=f6e188]:
                    - strong [ref=f6e189]: "Permanent locked liquidity:"
                    - text: Tokens are in a protocol-held pool that cannot be removed by the creator
                - listitem [ref=f6e190]:
                  - generic [ref=f6e191]:
                    - strong [ref=f6e192]: "Optional creator fees:"
                    - text: Creators can turn on an optional fee at launch and receive 0.05% of the 25bps fee
                - listitem [ref=f6e193]:
                  - generic [ref=f6e194]:
                    - strong [ref=f6e195]: "No launchpad fees:"
                    - text: Each pool launches a standard Uniswap pool, with a 0.25% LP fee that autocompounds to grow locked liquidity. This is a fraction of the standard ~1% on other launchpads
              - heading "[object Object]How launches work" [level=3] [ref=f6e196]:
                - link "[object Object]":
                  - /url: /pools-trade-a-new-way-to-launch-on-robinhood-chain#how-launches-work
                - text: How launches work
              - paragraph [ref=f6e197]: There are two ways to launch a token on Pools. Both start with a fixed supply of 1 billion and end in a Uniswap v4 pool. Fees autocompound to grow locked liquidity.
              - table [ref=f6e198]:
                - rowgroup [ref=f6e199]:
                  - row [ref=f6e200]:
