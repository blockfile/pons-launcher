              - paragraph [ref=f6e225]:
                - strong [ref=f6e226]: "Crowd Launch: Bundle resistant, fairer distribution"
              - paragraph [ref=f6e227]: Your token launches over a four-hour window. Everyone bids a budget, and bids fill gradually over the reminder of the launch window. Price moves with demand, so earlier bids get better prices.
              - paragraph [ref=f6e228]: Every budget fills in full by the end. The token is tradable if the launch reaches $10k FDV. If it falls short, all orders are refunded.
              - paragraph [ref=f6e229]:
                - strong [ref=f6e230]: "Instant Launch: Fast and simple"
              - paragraph [ref=f6e231]: Your token is live the moment you create it. The price climbs as people buy, and you can swap in and out anytime.
              - heading "[object Object]Your token everywhere" [level=3] [ref=f6e232]:
                - link "[object Object]":
                  - /url: /pools-trade-a-new-way-to-launch-on-robinhood-chain#your-token-everywhere
