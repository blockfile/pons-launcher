<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pons-launcher</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>pons&#8203;-launcher</h1>
      <div id="status" class="status">connecting…</div>
      <input id="apiKey" type="password" placeholder="API key" autocomplete="off" />
    </header>

    <main>
      <!-- ── wallets ─────────────────────────────────────────────────────── -->
      <section>
        <h2>1 · Wallets</h2>
        <div class="row">
          <button id="genDev" class="ghost">Generate dev wallet</button>
          <button id="genBundle" class="ghost">Generate bundle wallets</button>
          <input id="genCount" type="number" value="5" min="1" max="100" title="how many" />
          <button id="showImport" class="ghost">Import keys…</button>
          <button id="refreshWallets" class="ghost">Refresh balances</button>
        </div>
        <div id="importBox" class="hidden">
          <textarea id="importKeys" rows="3" placeholder="private keys, one per line"></textarea>
          <div class="row">
            <select id="importRole">
              <option value="bundle">bundle</option>
              <option value="dev">dev</option>
            </select>
            <button id="doImport">Import</button>
          </div>
        </div>
        <table id="wallets">
          <thead>
            <tr>
              <th>role</th><th>address</th><th>balance</th>
              <th>fund (ETH)</th><th>buy mode</th><th>buy (ETH)</th><th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <!-- ── funding ─────────────────────────────────────────────────────── -->
      <section>
        <h2>2 · Fund</h2>
        <p class="hint">
          Sends native ETH from the dev wallet to each bundle wallet using the
          <em>fund</em> column above. Leave a row blank to skip it.
        </p>
        <div class="row">
          <button id="fund">Disperse from dev wallet</button>
          <span class="spacer"></span>
          <label><input id="sweepTokens" type="checkbox" /> also sweep tokens</label>
          <input id="sweepToken" placeholder="token address (for token sweep)" />
          <button id="sweep" class="ghost">Sweep back to dev</button>
        </div>
      </section>

      <!-- ── launch ──────────────────────────────────────────────────────── -->
      <section>
        <h2>3 · Launch</h2>
        <div class="grid">
          <label>Name<input id="name" placeholder="Pons Cat" /></label>
          <label>Symbol<input id="symbol" placeholder="PONSCAT" /></label>
          <label>Logo URL<input id="logo" placeholder="https://…/logo.png" /></label>
          <label>Website<input id="website" placeholder="https://…" /></label>
          <label>Twitter<input id="twitter" placeholder="https://x.com/…" /></label>
          <label>Telegram<input id="telegram" placeholder="https://t.me/…" /></label>
          <label>Discord<input id="discord" /></label>
          <label>Farcaster<input id="farcaster" /></label>
          <label class="wide">Description<textarea id="description" rows="2"></textarea></label>
          <label class="wide">
            Fee wallet <span class="hint">— blank = the dev wallet, which also receives the atomic buy</span>
            <input id="feeWallet" placeholder="0x… (optional)" />
          </label>
          <label>Launch config<select id="launchConfigId"></select></label>
          <label>DEX<select id="dexId"></select></label>
          <label>
            Dev buy (ETH) <span class="hint">— atomic, uncapped</span>
            <input id="devBuyEth" type="number" step="0.0001" value="0.05" />
          </label>
        </div>
        <div id="configNote" class="note"></div>
        <div class="row">
          <button id="preflight" class="ghost">Preflight (signs, sends nothing)</button>
          <button id="launch" class="danger">LAUNCH + BUNDLE</button>
        </div>
      </section>

      <!-- ── output ──────────────────────────────────────────────────────── -->
      <section>
        <h2>4 · Result</h2>
        <pre id="out">—</pre>
      </section>

      <section>
        <h2>History</h2>
        <div id="history" class="history">—</div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
